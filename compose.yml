services:
  postgres:
    image: postgres:17
    container_name: codemaze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codemaze
      POSTGRES_USER: codemaze
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemaze -d codemaze"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

