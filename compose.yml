services:
  postgres:
    image: postgres:17
    container_name: codemaze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codemaze
      POSTGRES_USER: codemaze
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemaze -d codemaze"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: CodeMaze.Server/src/Dockerfile
      args:
        DOTNET_VERSION: "10.0"
    container_name: codemaze-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__CodeMaze: "Host=postgres;Port=5432;Database=codemaze;Username=codemaze;Password=password"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codemaze-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
